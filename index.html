<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Täysi — web-pohjainen maxi-jatsi (superjatsi) paikalliseen pass-and-play-moninpeliin. Offline, ei mainoksia eikä tiliä."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314143a'/%3E%3Crect x='7' y='7' width='18' height='18' rx='4' fill='%231e1e52'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23c9a84c'/%3E%3Ccircle cx='20' cy='12' r='2' fill='%23c9a84c'/%3E%3Ccircle cx='12' cy='20' r='2' fill='%23c9a84c'/%3E%3Ccircle cx='20' cy='20' r='2' fill='%23c9a84c'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#14143a" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Täysi</title>
    <script>
      // Service workerin rekisteröinti → asennettavuus + offline. Vain tuotannossa:
      // devissä (vite dev, ei-hashatut /src/*-URLit) cache-first SW jäisi tarjoilemaan
      // vanhoja lähdetiedostoja jokaisen muutoksen jälkeen.
      const isDev = location.hostname === "localhost" || location.hostname === "127.0.0.1";
      if ("serviceWorker" in navigator && !isDev) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </head>
  <body>
    <sj-app></sj-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
